    <circle cx="0" cy="0" r="118" fill="none" stroke="url(#holoGrad)" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.6" />
    <circle cx="0" cy="0" r="98" fill="url(#discGrad)" stroke="#F472B6" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="0" cy="0" r="72" fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.25" />
    <circle cx="0" cy="0" r="52" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.35" />
    <!-- Holographic Sheen Lines -->
    <path d="M -68 -68 L 68 68" stroke="#FFFFFF" stroke-width="12" stroke-opacity="0.07" />
    <path d="M -68 68 L 68 -68" stroke="#FF2A85" stroke-width="10" stroke-opacity="0.08" />
    <!-- Center Label -->
