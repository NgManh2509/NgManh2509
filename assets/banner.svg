    <text x="0" y="-3" text-anchor="middle" fill="#F472B6" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="700" letter-spacing="1.5">SIDE A</text>
    <text x="0" y="9" text-anchor="middle" fill="#FFFFFF" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1">2509</text>
    <circle cx="0" cy="0" r="5" fill="#140C24" stroke="#E879F9" stroke-width="1" />
    <!-- Sparkles around Disc -->
    <path d="M -115 -55 L -111 -43 L -99 -39 L -111 -35 L -115 -23 L -119 -35 L -131 -39 L -119 -43 Z" fill="#F472B6" />
    <path d="M 105 -85 L 108 -76 L 117 -73 L 108 -70 L 105 -61 L 102 -70 L 93 -73 L 102 -76 Z" fill="#38BDF8" />
    <path d="M 88 85 L 90 91 L 96 93 L 90 95 L 88 101 L 86 95 L 80 93 L 86 91 Z" fill="#E879F9" />
  </g>

  <!-- Left Content: Concept Tag Pill -->
  <rect x="44" y="84" width="350" height="28" rx="14" fill="#FF2A85" fill-opacity="0.16" stroke="#FF2A85" stroke-width="1" />
  <text x="62" y="102" fill="#F9A8D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="2">
    ★  MAIN BACKEND  ·  LEAD AUTOMATION  ·  VISUAL
  </text>

  <!-- Main Artist / Engineer Name -->
  <text x="44" y="176" fill="url(#holoText)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="3">
    NGUYỄN MẠNH
  </text>

  <!-- Sub-headline with Hangul & English -->
  <text x="46" y="212" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="500" letter-spacing="0.8">
    Engineering systems that hit every beat — <tspan fill="#F472B6" font-weight="700">Spring Boot</tspan>, <tspan fill="#C084FC" font-weight="700">n8n Choreography</tspan> &amp; <tspan fill="#38BDF8" font-weight="700">UI Visuals</tspan>.
  </text>

  <!-- Position / Concept Chips -->
  <g transform="translate(44, 236)">
    <rect x="0" y="0" width="196" height="32" rx="6" fill="#18112B" stroke="#F472B6" stroke-width="1" stroke-opacity="0.6" />
    <text x="98" y="20" text-anchor="middle" fill="#F8FAFC" font-family="'SF Mono', Consolas, monospace" font-size="11.5" font-weight="600">01 // BACKEND PRODUCER</text>

    <rect x="210" y="0" width="218" height="32" rx="6" fill="#18112B" stroke="#C084FC" stroke-width="1" stroke-opacity="0.6" />
    <text x="319" y="20" text-anchor="middle" fill="#F8FAFC" font-family="'SF Mono', Consolas, monospace" font-size="11.5" font-weight="600">02 // n8n FLOW DIRECTOR</text>

    <rect x="442" y="0" width="210" height="32" rx="6" fill="#18112B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" />
    <text x="547" y="20" text-anchor="middle" fill="#F8FAFC" font-family="'SF Mono', Consolas, monospace" font-size="11.5" font-weight="600">03 // CREATIVE VISUAL</text>
  </g>

  <!-- Bottom Footer Bar: Audio Equalizer & Barcode -->
  <line x1="44" y1="296" x2="820" y2="296" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.15" />

  <!-- Soundwave Equalizer Bars -->
  <g transform="translate(44, 308)" fill="url(#holoGrad)">
    <rect x="0" y="8" width="3" height="12" rx="1.5" />
    <rect x="6" y="2" width="3" height="18" rx="1.5" />
    <rect x="12" y="6" width="3" height="14" rx="1.5" />
    <rect x="18" y="0" width="3" height="20" rx="1.5" />
    <rect x="24" y="4" width="3" height="16" rx="1.5" />
    <rect x="30" y="9" width="3" height="11" rx="1.5" />
    <rect x="36" y="3" width="3" height="17" rx="1.5" />
    <rect x="42" y="7" width="3" height="13" rx="1.5" />
    <rect x="48" y="1" width="3" height="19" rx="1.5" />
    <rect x="54" y="5" width="3" height="15" rx="1.5" />
  </g>
  <text x="114" y="323" fill="#94A3B8" font-family="'SF Mono', Consolas, monospace" font-size="11" letter-spacing="1.5">
    NOW PLAYING: FULL-STACK ARCHITECTURE (FEAT. JAVA, PYTHON &amp; n8n) — 128 BPM
  </text>

  <!-- K-Pop Album Barcode Stamp -->
  <g transform="translate(1070, 302)" fill="#E2E8F0" fill-opacity="0.65">
    <rect x="0" y="0" width="2" height="22" />
    <rect x="5" y="0" width="4" height="22" />
    <rect x="12" y="0" width="1.5" height="22" />
    <rect x="16" y="0" width="3" height="22" />
    <rect x="22" y="0" width="1" height="22" />
    <rect x="26" y="0" width="5" height="22" />
    <rect x="34" y="0" width="2" height="22" />
    <rect x="39" y="0" width="1.5" height="22" />
    <rect x="44" y="0" width="4" height="22" />
    <rect x="51" y="0" width="2" height="22" />
    <rect x="56" y="0" width="3" height="22" />
    <rect x="62" y="0" width="1.5" height="22" />
    <rect x="66" y="0" width="4" height="22" />
    <rect x="73" y="0" width="2" height="22" />
    <rect x="78" y="0" width="3" height="22" />
    <rect x="84" y="0" width="2" height="22" />
  </g>
</svg>
