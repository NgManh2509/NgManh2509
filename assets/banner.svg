<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="stageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090612" />
      <stop offset="45%" stop-color="#140C24" />
      <stop offset="100%" stop-color="#0B0816" />
    </linearGradient>
    <linearGradient id="holoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="35%" stop-color="#E879F9" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="holoText" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F5D0FE" />
      <stop offset="75%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <radialGradient id="pinkSpot" cx="22%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#FF2A85" stop-opacity="0.24" />
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanSpot" cx="82%" cy="65%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1633" />
      <stop offset="55%" stop-color="#2E1C44" />
      <stop offset="75%" stop-color="#FF2A85" stop-opacity="0.45" />
      <stop offset="92%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8" />
    </radialGradient>
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F472B6" stroke-width="0.6" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Stage Base & Lighting -->
  <rect width="1200" height="360" rx="16" fill="url(#stageBg)" />
  <rect width="1200" height="360" rx="16" fill="url(#cyberGrid)" />
  <rect width="1200" height="360" rx="16" fill="url(#pinkSpot)" />
  <rect width="1200" height="360" rx="16" fill="url(#cyanSpot)" />

  <!-- Outer Holographic Border -->
  <rect x="2" y="2" width="1196" height="356" rx="15" fill="none" stroke="url(#holoGrad)" stroke-width="2" stroke-opacity="0.7" />
  <rect x="18" y="18" width="1164" height="324" rx="10" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.14" />

  <!-- Top Header Bar (K-Pop Teaser Metadata) -->
  <text x="44" y="48" fill="#F472B6" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="3.5">
    ✦ NGMANH STUDIO  //  OFFICIAL PRODUCER PROFILE
  </text>
  <text x="1156" y="48" text-anchor="end" fill="#94A3B8" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" letter-spacing="2.5">
    ALBUM VER. [25.09]  ·  응우옌 만
  </text>
  <line x1="44" y1="62" x2="1156" y2="62" stroke="url(#holoGrad)" stroke-width="1" stroke-opacity="0.35" />

  <!-- Decorative Holographic CD / Vinyl Concept Art on Right -->
  <g transform="translate(975, 188)">
