  <text x="1168" y="340" text-anchor="end" fill="#181A1F" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.5">
    [ FRAME 2509 / ∞ ]  —  github.com/NgManh2509
  </text>
</svg>
