<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <!-- Primary Airy Background (~75% neutral porcelain space, 100% FLAT, NO GRADIENTS) -->
  <rect width="1200" height="360" rx="8" fill="#FAF8F5" />
  <rect x="0.5" y="0.5" width="1199" height="359" rx="8" fill="none" stroke="#D9E2EC" stroke-width="1" />

  <!-- Top Y2K Digicam OSD Bar (Flat Surface #EEF3F8) -->
  <path d="M 1 9 C 1 4.58 4.58 1 9 1 L 1191 1 C 1195.42 1 1199 4.58 1199 9 L 1199 44 L 1 44 Z" fill="#EEF3F8" />
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#D9E2EC" stroke-width="1" />

  <!-- Top Left: Digicam REC Pill & Mode -->
  <rect x="24" y="11" width="112" height="22" rx="4" fill="#F6D6E3" stroke="#D9E2EC" stroke-width="1" />
  <circle cx="38" cy="22" r="3.5" fill="#181A1F" />
  <text x="50" y="26" fill="#181A1F" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1">REC 25:09</text>

  <text x="152" y="26" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11" letter-spacing="1.5">
    [ MODE: DREAMCORE // DIGITAL ARCHIVE ]
  </text>

  <!-- Top Right: Camera Metadata & Battery Icon -->
  <text x="1124" y="26" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11" letter-spacing="1.5">
    ISO 100  •  AF-S  •  [RAW]
  </text>
  <!-- Crisp Y2K Battery Indicator -->
  <rect x="1138" y="15" width="32" height="14" rx="2" fill="#FAF8F5" stroke="#64748B" stroke-width="1" />
  <rect x="1170" y="19" width="3" height="6" fill="#64748B" />
  <rect x="1141" y="18" width="8" height="8" fill="#A7D8F5" />
  <rect x="1151" y="18" width="8" height="8" fill="#A7D8F5" />
  <rect x="1161" y="18" width="6" height="8" fill="#F6D6E3" />

  <!-- Inner Digicam Viewfinder Frame & Focus Brackets -->
  <rect x="32" y="64" width="1136" height="236" rx="6" fill="none" stroke="#D9E2EC" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Corner Viewfinder Brackets [ ] -->
  <path d="M 52 96 L 52 80 L 68 80" fill="none" stroke="#181A1F" stroke-width="1.2" />
  <path d="M 1132 80 L 1148 80 L 1148 96" fill="none" stroke="#181A1F" stroke-width="1.2" />
  <path d="M 52 268 L 52 284 L 68 284" fill="none" stroke="#181A1F" stroke-width="1.2" />
  <path d="M 1132 284 L 1148 284 L 1148 268" fill="none" stroke="#181A1F" stroke-width="1.2" />

  <!-- Subtle Floating Pastel Geometry & 4-Point Stars (✦) -->
  <circle cx="176" cy="176" r="36" fill="#EEF3F8" stroke="#D9E2EC" stroke-width="1" />
  <circle cx="196" cy="192" r="16" fill="#F6D6E3" />
  <text x="176" y="181" text-anchor="middle" fill="#181A1F" font-family="Georgia, 'Times New Roman', serif" font-size="15">✦</text>

  <rect x="984" y="146" width="68" height="68" rx="8" fill="#EEF3F8" stroke="#D9E2EC" stroke-width="1" />
  <rect x="996" y="158" width="44" height="44" rx="6" fill="#A7D8F5" />
  <text x="1018" y="185" text-anchor="middle" fill="#181A1F" font-family="Georgia, 'Times New Roman', serif" font-size="16">✦</text>

  <!-- Center Eyebrow Metadata -->
  <text x="600" y="106" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11.5" letter-spacing="3">
    ✦  [ 00 ]  PORTFOLIO &amp; SYSTEM ARCHIVE  •  응우옌 만  ✦
  </text>

  <!-- Main Editorial Serif Display Title -->
  <text x="600" y="170" text-anchor="middle" fill="#181A1F" font-family="Georgia, 'Playfair Display', 'Times New Roman', serif" font-size="56" font-weight="400" letter-spacing="2">
    Nguyễn Mạnh
  </text>

  <!-- Dreamcore Italic Serif Subtitle -->
  <text x="600" y="202" text-anchor="middle" fill="#64748B" font-family="Georgia, 'Playfair Display', 'Times New Roman', serif" font-size="18" font-style="italic" letter-spacing="0.8">
    “quiet architecture, automated rhythm &amp; lucid interfaces.”
  </text>

  <!-- Flat Pastel Discipline Chips (Crisp 1px #D9E2EC borders) -->
  <g transform="translate(235, 226)">
    <!-- Chip 1: Surface Ice Blue -->
    <rect x="0" y="0" width="230" height="32" rx="6" fill="#EEF3F8" stroke="#D9E2EC" stroke-width="1" />
    <text x="115" y="20" text-anchor="middle" fill="#181A1F" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1">
      [ 01 • BACKEND SYSTEMS ]
    </text>

    <!-- Chip 2: Accent Pastel Pink -->
    <rect x="246" y="0" width="238" height="32" rx="6" fill="#F6D6E3" stroke="#D9E2EC" stroke-width="1" />
    <text x="365" y="20" text-anchor="middle" fill="#181A1F" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1">
      [ 02 • n8n AUTOMATION ]
    </text>

    <!-- Chip 3: Accent Pastel Sky Blue -->
    <rect x="500" y="0" width="230" height="32" rx="6" fill="#A7D8F5" stroke="#D9E2EC" stroke-width="1" />
    <text x="615" y="20" text-anchor="middle" fill="#181A1F" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1">
      [ 03 • UI / UX DESIGN ]
    </text>
  </g>

  <!-- Bottom Y2K Digicam Status Footer -->
  <line x1="32" y1="318" x2="1168" y2="318" stroke="#D9E2EC" stroke-width="1" />
  <text x="32" y="340" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11" letter-spacing="1.5">
    ✦  JAVA  •  SPRING BOOT  •  PYTHON  •  MONGODB  •  n8n  •  FIGMA
