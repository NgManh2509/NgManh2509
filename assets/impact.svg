      <stop offset="0%" stop-color="#0B0714" />
      <stop offset="50%" stop-color="#170E29" />
      <stop offset="100%" stop-color="#0B0714" />
    </linearGradient>
    <linearGradient id="impBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <rect width="1200" height="135" rx="12" fill="url(#impBg)" />
  <rect x="1.5" y="1.5" width="1197" height="132" rx="11" fill="none" stroke="url(#impBorder)" stroke-width="1.5" stroke-opacity="0.7" />

