  <line x1="480" y1="24" x2="480" y2="111" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1" />
  <line x1="720" y1="24" x2="720" y2="111" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1" />
  <line x1="960" y1="24" x2="960" y2="111" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1" />

